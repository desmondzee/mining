<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)">
<title>R² Radio · Rocky Robotics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --font-display: "Inter Tight", "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --paper-0: #0e0e0d;
    --paper-1: #151513;
    --paper-2: #1d1d1a;
    --rule: rgba(255, 255, 255, 0.09);
    --rule-strong: rgba(255, 255, 255, 0.18);
    --ink-90: #ecebe6;
    --ink-60: #a19f98;
    --ink-35: #6b6a64;
    --accent: #9aa5e6;
    --accent-soft: rgba(154, 165, 230, 0.12);
    --wash: rgba(255, 255, 255, 0.055);
    --danger: #e08a7e;
    --danger-soft: rgba(224, 138, 126, 0.1);

    --radius-sm: 4px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-pill: 999px;
    --glass-blur: blur(20px) saturate(140%);
    --glass-bg: rgba(21, 21, 19, 0.93);
    --glass-border: var(--rule);
    --glass-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.6), 0 2px 0 rgba(0, 0, 0, 0.2);
    --glass-scrim: rgba(0, 0, 0, 0.3);

    --ease-muji: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ease-spring: var(--ease-muji);
    --ease-press: cubic-bezier(0.34, 1.4, 0.64, 1);
    --t-fast: 120ms;
    --t-base: 180ms;
    --t-slow: 240ms;
    --gutter: 28px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --paper-0: #fbfaf6;
      --paper-1: #f4f2ec;
      --paper-2: #eceae3;
      --rule: #d9d6cd;
      --rule-strong: #b7b3a8;
      --ink-90: #1a1a1a;
      --ink-60: #5b5b58;
      --ink-35: #9c9a93;
      --accent: #2e3a8c;
      --accent-soft: #eaecf6;
      --wash: rgba(26, 26, 26, 0.045);
      --danger: #a8402f;
      --danger-soft: rgba(168, 64, 47, 0.07);
      --glass-bg: rgba(244, 242, 236, 0.95);
      --glass-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.25), 0 2px 0 rgba(0, 0, 0, 0.04);
      --glass-scrim: rgba(251, 250, 246, 0.3);
    }
  }

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper-0); color: var(--ink-90);
    font-family: var(--font-sans); font-size: 14px; line-height: 1.45; font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px;
    border: 1px solid var(--rule); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 10px; line-height: 1; color: var(--ink-35); }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }

  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  .top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 56px; padding: 0 var(--gutter); }
  .mark { display: flex; align-items: baseline; gap: 10px; }
  .mark h1 { font-family: var(--font-display); font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .mark .meta { color: var(--ink-35); }
  .top-right { display: flex; align-items: center; gap: 20px; }
  .state { font-family: var(--font-mono); font-size: 11px; color: var(--ink-60); animation: fade var(--t-slow) var(--ease-muji) both; }
  .state.mock { color: var(--ink-90); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10.5px; }
  .state.bad { color: var(--danger); }
  .quiet { font-size: 12px; color: var(--ink-35); min-height: 44px; transition: color var(--t-base) var(--ease-muji); }
  .quiet:hover { color: var(--ink-60); }
  .quiet[aria-pressed="true"] { color: var(--ink-90); }
  .slash { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink-60); font-family: var(--font-mono); font-size: 11px;
    transition: color var(--t-base) var(--ease-muji), transform var(--t-base) var(--ease-spring); }
  .slash kbd { border: 0; min-width: 0; padding: 0 2px; font-size: 12px; color: inherit; height: auto; }
  .slash:hover { color: var(--ink-90); }
  .slash:active { transform: scale(0.97); }

  .layout { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .site { flex: none; display: flex; flex-direction: column; gap: 14px; padding: 0 var(--gutter); }
  .mapwrap { position: relative; height: 24vh; min-height: 132px; border-radius: var(--radius-md); background: var(--paper-1); overflow: hidden; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #modeTag { position: absolute; left: 12px; top: 10px; color: var(--ink-35); pointer-events: none; }

  .fleet { display: grid; grid-template-columns: max-content max-content max-content minmax(0, 1fr); gap: 4px 2.2ch;
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-35); font-variant-numeric: tabular-nums; }
  .fleet li { display: contents; }
  .fleet li > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--t-slow) var(--ease-muji); }
  .fleet li > :nth-child(3) { text-align: right; }
  .fleet li.live > * { color: var(--ink-90); }
  .fleet li.gap > * { padding-top: 8px; }

  .talk { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 22px var(--gutter) 8px; display: flex; flex-direction: column; gap: 16px;
    -webkit-mask-image: linear-gradient(transparent, #000 36px, #000 calc(100% - 14px), transparent); mask-image: linear-gradient(transparent, #000 36px, #000 calc(100% - 14px), transparent); scrollbar-width: none; }
  .log::-webkit-scrollbar { display: none; }
  .log > :first-child { margin-top: auto; }
  .msg { display: grid; gap: 3px; max-width: 86%; animation: enter 420ms var(--ease-muji) both; transition: opacity var(--t-slow) var(--ease-muji); }
  .msg .who { display: flex; gap: 10px; color: var(--ink-35); transition: color var(--t-slow) var(--ease-muji); }
  .msg .txt { font-size: 15px; line-height: 1.45; letter-spacing: -0.006em; overflow-wrap: anywhere; }
  .msg.operator { align-self: flex-end; text-align: right; }
  .msg.operator .who { justify-content: flex-end; }
  .msg.operator .txt { color: var(--ink-60); }
  .msg.excavator .txt { font-weight: 300; }
  .msg.control .txt { font-family: var(--font-mono); font-size: 12px; color: var(--ink-60); }
  .msg.quiet { opacity: 0.5; }
  .msg.playing .who { color: var(--accent); }

  .heard { flex: none; height: 22px; padding: 0 var(--gutter); text-align: center; font-size: 13px; color: var(--ink-90);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--t-base) var(--ease-muji); }
  .heard.dim { color: var(--ink-35); font-family: var(--font-mono); font-size: 11px; line-height: 22px; }

  .controls { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 14px var(--gutter) 22px; }
  .arm { justify-self: start; min-height: 44px; padding: 0 16px; margin: 0 -16px; border: 1px solid transparent; border-radius: var(--radius-pill);
    font-size: 13px; letter-spacing: 0.005em; color: var(--ink-60); white-space: nowrap; user-select: none; -webkit-user-select: none;
    transition: color var(--t-base) var(--ease-muji), border-color var(--t-base) var(--ease-muji), background var(--t-base) var(--ease-muji), transform var(--t-base) var(--ease-spring), margin var(--t-slow) var(--ease-muji); }
  .arm:active { transform: scale(0.97); }
  .arm.end { justify-self: end; }
  .arm.danger { color: var(--danger); }
  .arm.armed { margin: 0; color: var(--ink-90); border-color: var(--rule-strong); }
  .arm.danger.armed { color: var(--danger); border-color: currentColor; background: var(--danger-soft); }

  #ptt { --lvl: 0; position: relative; width: 136px; height: 136px; border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--paper-1);
    color: var(--ink-90); font-family: var(--font-display); font-size: 17px; font-weight: 300; letter-spacing: 0.01em;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    transition: transform 520ms var(--ease-press), background var(--t-slow) var(--ease-muji), border-color var(--t-slow) var(--ease-muji); }
  #ptt .halo, #ptt .ring { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity var(--t-slow) var(--ease-muji); }
  #ptt .halo { inset: -1px; background: var(--accent-soft); transform: scale(calc(1 + var(--lvl) * 0.22)); }
  #ptt .ring { inset: -12px; border: 1px solid var(--accent); transform: scale(calc(0.97 + var(--lvl) * 0.12)); }
  #ptt .lbl { position: relative; transition: opacity var(--t-base) var(--ease-muji); }
  #ptt:hover { border-color: var(--ink-35); }
  #ptt.rec { transform: scale(0.95); background: var(--accent-soft); border-color: var(--accent); color: var(--accent); transition-duration: 360ms; }
  #ptt.rec .halo { opacity: 1; }
  #ptt.rec .ring { opacity: calc(0.25 + var(--lvl) * 0.75); }
  #ptt.busy .lbl { opacity: 0.35; }
  #ptt.busy .ring { opacity: 0.3; animation: breathe 1.6s var(--ease-muji) infinite; }

  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); z-index: 40; max-width: min(360px, calc(100vw - 32px));
    padding: 12px 18px; border: 1px solid var(--glass-border); border-radius: var(--radius-md); background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow);
    font-size: 13px; line-height: 1.5; color: var(--ink-90); text-align: center; transform: translateX(-50%); animation: drop var(--t-slow) var(--ease-spring) both; }

  .sheet-root { position: fixed; inset: 0; z-index: 30; }
  .scrim { position: absolute; inset: 0; background: var(--glass-scrim); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; transition: opacity var(--t-base) var(--ease-muji); }
  .sheet { position: absolute; left: 50%; top: 18vh; width: min(560px, calc(100vw - 32px)); max-height: min(520px, 70vh); display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--glass-border); border-radius: var(--radius-md); background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow);
    opacity: 0; transform: translate(-50%, -8px) scale(0.985); transition: opacity var(--t-base) var(--ease-muji), transform 320ms var(--ease-spring); margin: 0; }
  .sheet-root.open .scrim { opacity: 1; }
  .sheet-root.open .sheet { opacity: 1; transform: translate(-50%, 0); }
  .sheet-root.closing .sheet { transition-duration: var(--t-fast); }
  .sheet-row { display: flex; align-items: center; gap: 12px; padding: 16px 20px 14px; border-bottom: 1px solid var(--rule); }
  .glyph { font-family: var(--font-mono); font-size: 14px; color: var(--ink-35); }
  .sheet-row input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 18px; letter-spacing: -0.01em; color: var(--ink-90); }
  .sheet-row input::placeholder { color: var(--ink-35); }
  .options { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 8px 8px; scrollbar-width: none; }
  .options button { display: block; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 8px; text-align: left; font-size: 14px; letter-spacing: -0.003em;
    color: var(--ink-60); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--t-fast) var(--ease-muji), background var(--t-fast) var(--ease-muji); }
  .options button:hover, .options button[aria-selected="true"] { color: var(--ink-90); background: var(--wash); }

  .pin { top: 50%; width: min(320px, calc(100vw - 48px)); padding: 28px 28px 22px; align-items: center; gap: 18px; transform: translate(-50%, calc(-50% + 8px)) scale(0.985); }
  .sheet-root.open .pin { transform: translate(-50%, -50%); }
  .pin-title { font-family: var(--font-display); font-size: 15px; font-weight: 400; letter-spacing: -0.01em; color: var(--ink-60); }
  .pin input { width: 100%; border: 0; border-bottom: 1px solid var(--rule-strong); border-radius: 0; outline: 0; background: transparent; padding: 8px 0 10px;
    text-align: center; font-family: var(--font-mono); font-size: 24px; letter-spacing: 0.4em; color: var(--ink-90); transition: border-color var(--t-base) var(--ease-muji); }
  .pin input:focus { border-color: var(--ink-60); }
  .pin-note { height: 16px; color: var(--ink-35); }
  .pin.wrong input { border-color: var(--danger); animation: nudge 360ms var(--ease-muji); }
  .pin.wrong .pin-note { color: var(--danger); }

  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, -6px) scale(0.985); } }
  @keyframes breathe { 50% { opacity: 0.08; } }
  @keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  @media (max-width: 720px) {
    :root { --gutter: 16px; }
    .top { height: 52px; }
    .mapwrap { height: 22vh; }
    .fleet { column-gap: 1.6ch; }
    .talk { margin-top: 14px; border-top: 1px solid var(--rule); }
    .msg { max-width: 92%; }
    .controls { padding-bottom: 14px; }
    .sheet { top: max(12px, env(safe-area-inset-top)); width: calc(100vw - 24px); max-height: calc(100dvh - 24px); }
    .pin { top: 42%; }
    .esc { display: none; }
  }

  @media (max-height: 700px) and (max-width: 720px) {
    .mapwrap { height: 18vh; min-height: 108px; }
    #ptt { width: 116px; height: 116px; }
  }

  @media (min-width: 960px) {
    .layout { flex-direction: row; padding-bottom: 8px; }
    .site { flex: 1; min-width: 0; gap: 22px; padding-bottom: 20px; }
    .mapwrap { flex: 1; height: auto; }
    .talk { flex: none; width: 440px; border-left: 1px solid var(--rule); }
    .log { padding-top: 8px; }
    #ptt { width: 152px; height: 152px; }
    .controls { padding: 22px var(--gutter) 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="mark"><h1>r² radio</h1><span class="meta">ch 1</span></div>
  <div class="top-right">
    <span id="state" class="state" role="status" hidden></span>
    <button id="spk" class="quiet" type="button" aria-pressed="false">mute</button>
    <button id="cmdOpen" class="slash" type="button" aria-label="Commands" aria-keyshortcuts="/"><kbd>/</kbd><span>type</span></button>
  </div>
</header>

<main class="layout">
  <section class="site" aria-label="Site">
    <div class="mapwrap"><canvas id="map" role="img" aria-label="Site map"></canvas><span id="modeTag" class="meta"></span></div>
    <ul id="fleet" class="fleet" aria-label="Fleet"></ul>
  </section>
  <section class="talk" aria-label="Radio">
    <div id="log" class="log" aria-live="polite"></div>
    <p id="heard" class="heard dim"></p>
    <div class="controls">
      <button id="stopAll" class="arm danger" type="button">all stop</button>
      <button id="ptt" type="button" aria-label="Hold to talk" aria-keyshortcuts="Space"><span class="halo"></span><span class="ring"></span><span class="lbl">talk</span></button>
      <button id="release" class="arm end" type="button">release</button>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="alert" hidden></div>

<div id="sheet" class="sheet-root" hidden>
  <div class="scrim" data-close></div>
  <form id="txt" class="sheet" role="dialog" aria-modal="true" aria-label="Commands">
    <div class="sheet-row">
      <span class="glyph" aria-hidden="true">/</span>
      <input id="cmd" type="text" placeholder="say to the fleet" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" role="combobox" aria-controls="quick" aria-expanded="true">
      <kbd class="esc">esc</kbd>
    </div>
    <div id="quick" class="options" role="listbox"></div>
  </form>
</div>

<div id="pinRoot" class="sheet-root" hidden>
  <div class="scrim" data-close></div>
  <form id="pinForm" class="sheet pin" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
    <p id="pinTitle" class="pin-title">access code</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" enterkeyhint="go" aria-labelledby="pinTitle">
    <p id="pinNote" class="pin-note meta"></p>
  </form>
</div>

<script>
const rawFetch = window.fetch.bind(window);
let loginPending = null, loginDeclined = false;

const sheets = {
  show(root) {
    clearTimeout(root._t); root.classList.remove("closing"); root.hidden = false;
    void root.offsetWidth; root.classList.add("open");
  },
  hide(root) {
    if (root.hidden) return;
    root.classList.remove("open"); root.classList.add("closing");
    root._t = setTimeout(() => { root.hidden = true; root.classList.remove("closing"); }, 180);
  },
};

function askPin(wrong) {
  const root = document.getElementById("pinRoot"), form = document.getElementById("pinForm"), input = document.getElementById("pinInput");
  return new Promise((resolve) => {
    form.classList.toggle("wrong", !!wrong);
    document.getElementById("pinNote").textContent = wrong ? "incorrect" : "";
    input.value = "";
    sheets.show(root);
    input.focus();
    const done = (v) => {
      form.onsubmit = null; root.querySelector("[data-close]").onclick = null; input.onkeydown = null;
      sheets.hide(root); input.blur(); resolve(v);
    };
    form.onsubmit = (e) => { e.preventDefault(); done(input.value); };
    root.querySelector("[data-close]").onclick = () => done(null);
    input.onkeydown = (e) => { if (e.key === "Escape") done(null); };
  });
}

function login() {
  if (loginDeclined) return Promise.resolve(false);
  loginPending = loginPending || (async () => {
    let wrong = false;
    for (;;) {
      const pin = await askPin(wrong);
      if (pin === null) { loginDeclined = true; return false; }
      const r = await rawFetch("/api/radio/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pin }) }).catch(() => null);
      if (r && r.ok) return true;
      if (r && r.status === 429) { toast("Too many attempts. Wait a minute."); loginDeclined = true; return false; }
      wrong = true;
    }
  })().finally(() => { loginPending = null; });
  return loginPending;
}
document.addEventListener("pointerdown", () => { loginDeclined = false; });
window.fetch = async (url, opts) => {
  const r = await rawFetch(url, opts);
  if (r.status === 401 && !String(url).endsWith("/api/radio/login") && await login()) return rawFetch(url, opts);
  return r;
};
const MAX_REC_MS = 30000;
"use strict";
const $ = (s) => document.querySelector(s);
const QUICK = [
  "Truck one go to the lower face",
  "Truck two haul from the middle face to the crusher",
  "Truck three haul two loads from the lower face to the crusher",
  "All trucks return to the ready line",
  "Excavator one start digging",
  "All excavators hold",
  "Everyone stop",
  "Status report",
];
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

function toast(msg, ms = 3500) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  t.style.animation = "none"; void t.offsetWidth; t.style.animation = "";
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms);
}
function setHeard(text, dim = false) { const h = $("#heard"); h.textContent = text; h.classList.toggle("dim", dim); }

const status = { offline: false, brain: true, mock: false, sim: true, stt: true, tts: true, llm: true };
function renderStatus() {
  const s = status;
  const [word, cls] = s.offline ? ["offline", "bad"] : !s.brain ? ["no brain", "bad"] : s.mock ? ["mock", "mock"]
    : !s.sim ? ["no sim", "bad"] : !s.stt ? ["no stt", ""] : !s.tts ? ["no tts", ""] : !s.llm ? ["regex", ""] : ["", ""];
  const el = $("#state");
  if (el.textContent !== word) el.textContent = word;
  el.className = "state " + cls;
  el.hidden = !word;
  const all = [s.mock && "mock", !s.stt && "no stt", !s.tts && "no tts", !s.llm && "regex"].filter(Boolean);
  el.title = all.join(" · ");
}

const logEl = $("#log");
const seen = new Set();
function addLog(ev) {

  d.innerHTML = `<div class="who meta"><span class="from"></span><span class="tm"></span></div><p class="txt"></p>`;
  d.querySelector(".from").textContent = ev.kind === "operator" ? "dispatch" : (ev.from || "control").toLowerCase();
  d.querySelector(".tm").textContent = tm;

}

let trucks = [], excs = [], world = null, mode = null;
const LIVE = new Set(["driving", "avoiding", "digging"]);
function renderFleet() {
  const rows = [];
  for (const t of trucks) {
    const kmh = Math.round((t.speed || 0) * 3.6);
    const rem = t.remaining_m != null ? ` · ${t.remaining_m} m` : "";
    rows.push({ cls: LIVE.has(t.status) ? "live" : "", cells: [t.callsign, t.status || "", kmh ? `${kmh} km/h` : "", (t.task || "standing by") + rem] });
  }
  excs.forEach((e, i) => rows.push({ cls: (i ? "" : "gap") + (LIVE.has(e.state) ? " live" : ""), cells: [e.callsign, e.state || "holding", "", e.face_name || e.face || ""] }));
  const box = $("#fleet");
  while (box.children.length > rows.length) box.lastChild.remove();
  rows.forEach((r, i) => {
    let li = box.children[i];
    if (!li) { li = document.createElement("li"); box.appendChild(li); }
    li.className = r.cls;
    while (li.children.length > r.cells.length) li.lastChild.remove();
    r.cells.forEach((c, j) => {
      let s = li.children[j];
      if (!s) { s = document.createElement("span"); li.appendChild(s); }
      if (s.textContent !== String(c)) s.textContent = c;
    });
  });
}

const cv = $("#map"), g = cv.getContext("2d");
let ext = null;
function grow(x, z) {
  if (!ext) ext = { x0: x, x1: x, z0: z, z1: z };
  ext.x0 = Math.min(ext.x0, x); ext.x1 = Math.max(ext.x1, x); ext.z0 = Math.min(ext.z0, z); ext.z1 = Math.max(ext.z1, z);
}
function drawMap() {
  const cs = getComputedStyle(document.documentElement), tk = (n) => cs.getPropertyValue(n).trim();
  const ink90 = tk("--ink-90"), ink60 = tk("--ink-60"), ink35 = tk("--ink-35"), paper0 = tk("--paper-0"), paper1 = tk("--paper-1"), road = tk("--wash"), edge = tk("--rule-strong");
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  if (world) for (const r of world.roads) for (const [x, z] of r.points) grow(x, z);
  for (const t of trucks) grow(t.x, t.z);
  for (const e of excs) grow(e.x, e.z);
  if (!ext) return;
  const padL = 28, padR = 76, pad = 26, sx = (W - padL - padR) / Math.max(1, ext.x1 - ext.x0), sz = (H - 2 * pad) / Math.max(1, ext.z1 - ext.z0);
  const s = Math.min(sx, sz), ox = padL + (W - padL - padR - s * (ext.x1 - ext.x0)) / 2, oy = (H - s * (ext.z1 - ext.z0)) / 2;
  const P = (x, z) => [ox + (x - ext.x0) * s, H - oy - (z - ext.z0) * s];
  if (world && basemap && basemap.complete && basemap.naturalWidth && world.origin) {
    const [x0, y0] = P(world.origin[0], world.origin[1] + world.size_m[1]), [x1, y1] = P(world.origin[0] + world.size_m[0], world.origin[1]);
    g.drawImage(basemap, x0, y0, x1 - x0, y1 - y0);
  }

    }

    }
  }
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 260);
  for (const e of excs) {
    const [px, py] = P(e.x, e.z), dig = e.state === "digging";
    if (dig) {
      g.globalAlpha = 0.35 * (1 - pulse); g.strokeStyle = ink90; g.lineWidth = 1;
      const k = 6 + 5 * pulse; g.strokeRect(px - k, py - k, 2 * k, 2 * k); g.globalAlpha = 1;
    }
    g.lineWidth = 1.25;
    if (dig) { g.fillStyle = ink90; g.fillRect(px - 3.5, py - 3.5, 7, 7); }
    else { g.strokeStyle = ink60; g.strokeRect(px - 3.5, py - 3.5, 7, 7); }
  }
  g.font = `500 10px ${tk("--font-mono")}`;
  for (const t of trucks) {
    if (t.route && t.route.length) {
      g.strokeStyle = ink35; g.setLineDash([2, 4]); g.lineWidth = 1.25;
      g.beginPath(); g.moveTo(...P(t.x, t.z)); for (const [x, z] of t.route) g.lineTo(...P(x, z)); g.stroke();
      g.setLineDash([]);
    }
    const [px, py] = P(t.x, t.z), a = (t.yaw || 0) * Math.PI / 180, k = 6.5;
    g.save(); g.translate(px, py); g.rotate(a);
    g.fillStyle = ink90; g.strokeStyle = paper0; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(0, -k); g.lineTo(k * .62, k * .7); g.lineTo(-k * .62, k * .7); g.closePath(); g.stroke(); g.fill();
    g.restore();
    const n = String(Number((t.id || "").split("-")[1]) + 1);
    if (n !== "NaN") { g.lineWidth = 3; g.strokeStyle = paper1; g.strokeText(n, px - 14, py); g.fillStyle = ink90; g.fillText(n, px - 14, py); }
  }
}
window.addEventListener("resize", drawMap);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawMap);
let basemap = null;
fetch("/api/radio/world").then((r) => r.json()).then((w) => {
  world = w;
  drawMap();
}).catch(() => {});

let ctx = null, chainIn = null, noiseBuf = null, speakerOn = true;
function ensureCtx() {

    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3400; lp.Q.value = 0.7;
    const mid = ctx.createBiquadFilter(); mid.type = "peaking"; mid.frequency.value = 1700; mid.gain.value = 5; mid.Q.value = 1;
    const sh = ctx.createWaveShaper(); const n = 1024, curve = new Float32Array(n), kk = 6;
    for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; curve[i] = ((1 + kk) * x) / (1 + kk * Math.abs(x)); }

    hp.connect(lp); lp.connect(mid); mid.connect(sh); sh.connect(out); out.connect(ctx.destination);
    chainIn = hp;

    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0);
  }

}

  const src = ctx.createBufferSource(); src.buffer = noiseBuf;
  const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2200; bp.Q.value = 0.6;
  const gn = ctx.createGain(); gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(bp); bp.connect(gn); gn.connect(ctx.destination); src.start(t0); src.stop(t0 + dur + 0.02);

  const og = ctx.createGain(); og.gain.setValueAtTime(0.06, t0); og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.03);
  o.connect(og); og.connect(ctx.destination); o.start(t0); o.stop(t0 + 0.04);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const queue = [];
let playing = false, recording = false;
function enqueue(ev) {
  if (!ev || ev.kind === "operator" || ev.spoken === false || !ev.text) return;
  if (seen.has("play:" + ev.id)) return;
  seen.add("play:" + ev.id);
  if (!speakerOn) return;
  queue.push(ev);
  pump();
}
async function pump() {
  if (playing) return;
  playing = true;
  try {
    while (queue.length) {
      while (recording) await sleep(100);
      const ev = queue.shift();
      const el = document.getElementById("m-" + ev.id); if (el) el.classList.add("playing");
      try { await playEvent(ev); } catch (e) { console.warn("play failed", e); try { await speak(ev); } catch (_) {} }
      if (el) el.classList.remove("playing");
      await sleep(180);
    }
  } finally { playing = false; }
}
async function playEvent(ev) {
  if (!ev.audio_url || !ctx) return speak(ev);
  const buf = await fetch(ev.audio_url).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
  const audio = await new Promise((res, rej) => ctx.decodeAudioData(buf, res, rej));
  squelch(0.1, 0.16);
  await sleep(90);

  const hg = ctx.createGain(); hg.gain.value = 0.012; const hb = ctx.createBiquadFilter(); hb.type = "bandpass"; hb.frequency.value = 2500;
  hiss.connect(hb); hb.connect(hg); hg.connect(ctx.destination);
  await new Promise((res) => { src.onended = res; src.start(); hiss.start(); setTimeout(res, audio.duration * 1000 + 1500); });
  try { hiss.stop(); } catch (_) {}

}
function speak(ev) {
  return new Promise((res) => {
    if (!("speechSynthesis" in window)) return res();
    squelch(0.1, 0.16);
    const u = new SpeechSynthesisUtterance(ev.text);
    const isExc = (ev.truck_id || "").startsWith("exc-");
    const idx = isExc ? 4 : { "truck-0": 0, "truck-1": 1, "truck-2": 2 }[ev.truck_id];
    u.rate = 1.08; u.pitch = idx == null ? 1.15 : [0.8, 1.0, 0.65, 1, 0.5][idx];

    if (vs.length) u.voice = vs[(idx == null ? 3 : idx) % vs.length];
    const done = () => { squelch(0.14, 0.18); res(); };

$("#spk").onclick = () => {
  ensureCtx(); speakerOn = !speakerOn;
  $("#spk").textContent = speakerOn ? "mute" : "muted"; $("#spk").setAttribute("aria-pressed", String(!speakerOn));
  if (!speakerOn) { queue.length = 0; try { speechSynthesis.cancel(); } catch (_) {} }
};

let busy = false;
async function sendCommand(text) {
  text = (text || "").trim();
  if (!text) return;
  setHeard("“" + text + "”");
  try {
    const r = await fetch("/api/radio/command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    for (const rep of j.replies || []) {
      const ev = { id: rep.id, from: rep.callsign, truck_id: rep.truck_id, text: rep.text, audio_url: rep.audio_url, kind: !rep.truck_id ? "control" : rep.truck_id.startsWith("exc-") ? "excavator" : "truck", t: Date.now() / 1000 };
      addLog(ev); enqueue(ev);
    }
  } catch (e) { toast("Command failed: " + e.message); }
}

const sheet = $("#sheet"), cmd = $("#cmd"), quick = $("#quick");
let sel = -1;
function renderQuick() {
  const q = cmd.value.trim().toLowerCase();
  quick.innerHTML = "";
  for (const text of QUICK.filter((x) => !q || x.toLowerCase().includes(q))) {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "option"); b.textContent = text;
    b.onclick = () => { ensureCtx(); closeSheet(); sendCommand(text); };
    quick.appendChild(b);
  }
  sel = -1;
}
function mark() { [...quick.children].forEach((b, i) => b.setAttribute("aria-selected", String(i === sel))); if (quick.children[sel]) quick.children[sel].scrollIntoView({ block: "nearest" }); }
function openSheet() { cmd.value = ""; renderQuick(); sheets.show(sheet); cmd.focus(); }
function closeSheet() { cmd.blur(); sheets.hide(sheet); }
$("#cmdOpen").onclick = () => { ensureCtx(); openSheet(); };
sheet.querySelector("[data-close]").onclick = closeSheet;
cmd.oninput = renderQuick;
cmd.onkeydown = (e) => {
  const n = quick.children.length;
  if (e.key === "Escape") { e.preventDefault(); closeSheet(); }
  else if (e.key === "ArrowDown" && n) { e.preventDefault(); sel = (sel + 1) % n; mark(); }
  else if (e.key === "ArrowUp" && n) { e.preventDefault(); sel = (sel - 1 + n) % n; mark(); }
};
$("#txt").onsubmit = (e) => {
  e.preventDefault(); ensureCtx();
  const v = sel >= 0 && quick.children[sel] ? quick.children[sel].textContent : cmd.value;
  closeSheet(); sendCommand(v);
};
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && sheet.hidden) { e.preventDefault(); ensureCtx(); openSheet(); }
});

function armable(btn, armedLabel, run) {
  const label = btn.textContent;
  let timer = null;
  const disarm = () => { clearTimeout(timer); btn.classList.remove("armed"); btn.textContent = label; };
  btn.onclick = () => {
    ensureCtx();
    if (btn.classList.contains("armed")) { disarm(); run(); return; }
    btn.classList.add("armed"); btn.textContent = armedLabel;
    timer = setTimeout(disarm, 3000);
  };
}
armable($("#stopAll"), "confirm", () => sendCommand("All trucks stop"));
armable($("#release"), "confirm", async () => {
  await fetch("/api/radio/release", { method: "POST" }).catch(() => toast("Release failed"));
});

let stream = null, rec = null, chunks = [], recStart = 0, pressed = false, analyser = null, mimeType = "";
function pickMime() {
  if (!window.MediaRecorder) return null;
  const c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/aac", "audio/ogg;codecs=opus"];
  for (const m of c) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (_) {} }
  return "";
}
async function getStream() {
  if (stream && stream.getAudioTracks().some((t) => t.readyState === "live")) return stream;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error(location.protocol === "https:" ? "Microphone not available" : "Microphone needs HTTPS");
  }
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  try {
    const srcNode = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 512; srcNode.connect(analyser);
  } catch (_) { analyser = null; }
  return stream;
}
let lvl = 0;
function meter() {
  const btn = $("#ptt");
  if (!recording || !analyser) { lvl = 0; btn.style.setProperty("--lvl", "0"); return; }
  const a = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(a);
  let m = 0; for (const v of a) m = Math.max(m, Math.abs(v - 128));
  const target = Math.min(1, (m / 128) * 1.8);
  lvl += (target - lvl) * (target > lvl ? 0.45 : 0.12);
  btn.style.setProperty("--lvl", lvl.toFixed(3));
  requestAnimationFrame(meter);
}
async function pttDown(e) {
  if (e) e.preventDefault();
  if (pressed || busy) return;
  pressed = true;
  ensureCtx();
  try { speechSynthesis.cancel(); } catch (_) {}
  const btn = $("#ptt");
  let s;
  try { s = await getStream(); } catch (err) { pressed = false; toast(err.message || String(err), 6000); return; }
  if (!pressed) { setHeard("mic ready", true); return; }
  if (mimeType === "") mimeType = pickMime();
  if (mimeType === null) { pressed = false; toast("Recording not supported here. Type instead."); return; }
  chunks = [];
  try { rec = new MediaRecorder(s, mimeType ? { mimeType } : undefined); } catch (_) { rec = new MediaRecorder(s); }
  rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  rec.onstop = onRecStop;
  squelch(0.05, 0.1);
  rec.start();
  recStart = performance.now(); recording = true;
  const started = recStart;
  setTimeout(() => { if (recording && recStart === started) { toast("30 s limit"); pttUp(); } }, MAX_REC_MS);
  btn.classList.add("rec");
  setHeard("listening", true);
  meter();
}
async function pttUp(e) {
  if (e) e.preventDefault();
  if (!pressed) return;
  pressed = false;
  $("#ptt").classList.remove("rec");
  if (!rec || rec.state === "inactive") { recording = false; return; }
  await sleep(250);
  try { rec.stop(); } catch (_) {}
}
async function onRecStop() {

  const blob = new Blob(chunks, { type });

  const ext = type.includes("webm") ? "webm" : type.includes("ogg") ? "ogg" : type.includes("aac") ? "aac" : "m4a";
  const fd = new FormData(); fd.append("audio", blob, "ptt." + ext);

  try {
    const r = await fetch("/api/radio/transcribe", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    if (!j.text) { setHeard("say again", true); return; }
    await sendCommand(j.text);
  } catch (err) {

const ptt = $("#ptt");
ptt.addEventListener("pointerdown", (e) => { try { ptt.setPointerCapture(e.pointerId); } catch (_) {} pttDown(e); });
ptt.addEventListener("pointerup", pttUp);
ptt.addEventListener("pointercancel", pttUp);
ptt.addEventListener("contextmenu", (e) => e.preventDefault());
ptt.addEventListener("click", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat && document.activeElement.tagName !== "INPUT") pttDown(e); });
document.addEventListener("keyup", (e) => { if (e.code === "Space" && document.activeElement.tagName !== "INPUT") pttUp(e); });

let ws = null, backoff = 500, wsOpen = false, polled = false;
function handleState(msg) {
  trucks = msg.trucks || []; excs = msg.excavators || []; renderFleet(); drawMap();
  mode = msg.mode;
  Object.assign(status, { offline: false, brain: !!msg.brain_ok, mock: msg.mode === "mock", sim: !!msg.sim_connected });
  renderStatus();
  $("#modeTag").textContent = msg.mode === "mock" ? "simulated" : "";
}
setInterval(async () => {
  if (wsOpen) return;
  try {
    const j = await fetch("/api/radio/state").then((r) => r.json());
    handleState(j);
    for (const ev of j.log || []) { if (!polled) seen.add("play:" + ev.id); addLog(ev); enqueue(ev); }
    polled = true;
  } catch (_) { status.offline = true; renderStatus(); }
}, 600);
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/radio");
  ws.onopen = () => { backoff = 500; wsOpen = true; };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "hello") {
      health(msg.health);
      for (const ev of msg.log || []) { addLog(ev); seen.add("play:" + ev.id); }
    } else if (msg.type === "state") {
      handleState(msg);
    } else if (msg.type === "radio") {
      addLog(msg); enqueue(msg);
    }
  };
  ws.onclose = async (e) => {
    wsOpen = false;
    if (e.code === 4401 && !(await login())) { setTimeout(connect, 5000); return; }
    setTimeout(connect, backoff); backoff = Math.min(5000, backoff * 2);
  };
}
function health(h) {
  if (!h) return;
  Object.assign(status, { stt: !!h.stt, tts: !!h.tts, llm: !!h.llm });
  renderStatus();
}
fetch("/api/radio/health").then((r) => r.json()).then(health).catch(() => {});
setInterval(() => fetch("/api/radio/health").then((r) => r.json()).then(health).catch(() => {}), 10000);
connect();
if (location.protocol !== "https:" && !["localhost", "127.0.0.1"].includes(location.hostname)) {
  toast("Microphone needs HTTPS. Open the tunnel URL.", 8000);
}
