# Run from deploy/:
#   cp .env.example .env && docker compose up -d --build
#   docker compose --profile tls up -d --build      # + Caddy HTTPS on $DOMAIN
#   docker compose --profile tunnel up -d --build   # + Cloudflare quick tunnel (HTTPS URL in logs)
#   docker compose --profile tools run --rm envgen python -m envgen.procedural --seed 42 --id default
name: physical-mining

services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file:
      - path: .env
        required: false   # compose >= 2.24; all keys optional
    environment:
      DATA_DIR: /app/data
    volumes:
      - ../data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    restart: unless-stopped

  envgen:
    build:
      context: ..
      dockerfile: deploy/envgen.Dockerfile
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false   # compose >= 2.24; all keys optional
    environment:
      DATA_DIR: /app/data
    volumes:
      - ../data:/app/data
      - ./secrets:/run/secrets:ro   # one file per key, e.g. secrets/wlt_api_key

volumes:
  caddy_data:
  caddy_config:
