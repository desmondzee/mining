[project]
name = "brain"
version = "0.1.0"
description = "Policy + streaming server for the autonomous quarry sim"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "pillow>=10.4",
    "av>=19.0.1",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
# Only to export or load a .pt planner checkpoint; the brain runs the exported .npz with numpy.
model = ["torch>=2.2"]

[project.scripts]
brain = "brain.app:main"
fakesim = "brain.fakesim:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
