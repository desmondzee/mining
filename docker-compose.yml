name: mining

services:
  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    devices:
      - nvidia.com/gpu=all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      DETECTOR_DEVICE: ${DETECTOR_DEVICE:-auto}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-auto}
      WORLD_DIR: /app/data/worlds/quarry
      PLANNER_CKPT: ${PLANNER_CKPT-/app/models/ppo_v3.npz}
      RADIO_URL: ${RADIO_URL:-http://radio:8090}
      LIDAR_HEIGHT: ${LIDAR_HEIGHT:-2.7}
      DETECTOR_MODEL: ${DETECTOR_MODEL-/app/models/yolo11n.onnx}
      DETECTOR_CLASSES: ${DETECTOR_CLASSES:-}
      DETECTOR_THREADS: ${DETECTOR_THREADS:-2}
      DETECTOR_WORKERS: ${DETECTOR_WORKERS:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
      MAX_SPEED: ${MAX_SPEED:-5.0}
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    restart: unless-stopped

  fakesim:
    profiles: ["fake"]
    build:
      context: .
      dockerfile: brain/Dockerfile
    command: ["fakesim", "--host", "brain", "--port", "9000", "--trucks", "3", "--world", "${FAKESIM_WORLD-/app/data/worlds/quarry}"]
    volumes:
      - ./data:/app/data:ro
    depends_on: [brain]
    restart: unless-stopped

  tunnel:
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    network_mode: host
    depends_on: [brain]
    restart: unless-stopped
