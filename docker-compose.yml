name: mining

services:
  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    environment:
      WORLD_DIR: /app/data/worlds/quarry
      PLANNER_CKPT: ${PLANNER_CKPT-/app/models/ppo_v3.npz}
      RADIO_URL: ${RADIO_URL:-http://radio:8090}
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    restart: unless-stopped

  fakesim:
    profiles: ["fake"]
    build:
      context: .
      dockerfile: brain/Dockerfile
    command: ["fakesim", "--host", "brain", "--port", "9000", "--trucks", "3", "--world", "${FAKESIM_WORLD-/app/data/worlds/quarry}"]
    volumes:
      - ./data:/app/data:ro
    depends_on: [brain]
    restart: unless-stopped

  tunnel:
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    network_mode: host
    depends_on: [brain]
    restart: unless-stopped
