<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="radio-url" content="">
  <title>Quarry</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hud.css">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("quarry-theme") || "dark"; } catch { document.documentElement.dataset.theme = "dark"; }
    try { document.documentElement.dataset.view = localStorage.getItem("quarry-view") || "ops"; } catch { document.documentElement.dataset.view = "ops"; }
  </script>
</head>
<body>
  <main id="views" class="views" aria-live="off">
    <section id="surface-video" class="surface" data-surface="video" aria-label="Camera">
      <div id="feeds" class="feeds"></div>
      <p class="surface-empty" id="feeds-empty">no cameras</p>
    </section>
    <section id="surface-lidar" class="surface" data-surface="lidar" aria-label="Lidar">
      <canvas id="lidar" role="img" aria-label="3D lidar point cloud for the selected truck. Drag to orbit."></canvas>
    </section>
    <section id="surface-map" class="surface" data-surface="map" aria-label="Map">
      <canvas id="map" width="1200" height="1200" role="img" aria-label="Top-down site map. Click to send the selected truck to a point."></canvas>
    </section>
    <section id="surface-fleet" class="surface page" data-surface="fleet" aria-label="Fleet">
      <div class="page-inner">
        <dl class="kpis" id="kpis">
          <div><dt>loads</dt><dd data-kpi="loads">0</dd></div>
          <div><dt>tonnes</dt><dd data-kpi="tonnes">0</dd></div>
          <div><dt>avg cycle</dt><dd data-kpi="cycle">—</dd></div>
          <div><dt>idle</dt><dd data-kpi="idle">—</dd></div>
        </dl>
        <p class="kpi-since meta" id="kpi-since"></p>
        <ul class="roster" id="roster" aria-label="Vehicles"></ul>
      </div>
    </section>
    <section id="surface-radio" class="surface page" data-surface="radio" aria-label="Radio">
      <ol class="transcript" id="transcript" aria-live="polite"></ol>
    </section>
    <section id="surface-judge" class="surface page" data-surface="judge" aria-label="Judge">
      <div class="judge">
        <ol class="transcript large" id="judge-transcript" aria-live="polite"></ol>
        <aside class="judge-side">
          <div class="qr" id="qr" aria-label="Radio QR code"></div>
          <p class="judge-url meta" id="judge-url"></p>
          <p class="judge-pin" id="judge-pin" hidden></p>
          <p class="judge-kpis meta" id="judge-kpis"></p>
        </aside>
      </div>
    </section>
  </main>

  <header class="chrome bar">
    <nav class="bar-left tabs" aria-label="Views">
      <button type="button" class="tab" data-tab="ops">ops</button>
      <button type="button" class="tab" data-tab="video">video</button>
      <button type="button" class="tab" data-tab="map">map</button>
      <button type="button" class="tab" data-tab="lidar">lidar</button>
      <button type="button" class="tab" data-tab="fleet">fleet</button>
      <button type="button" class="tab" data-tab="radio">radio</button>
      <button type="button" class="tab" data-tab="judge">judge</button>
      <button type="button" class="tab" data-tab="split">split</button>
      <span class="tab-rule" aria-hidden="true"></span>
      <span id="bar-camera" class="bar-camera"></span>
    </nav>
    <dl class="bar-kpis" aria-label="Shift totals">
      <div><dd data-kpi="loads">0</dd><dt>loads</dt></div>
      <div><dd data-kpi="tonnes">0</dd><dt>t</dt></div>
      <div><dd data-kpi="cycle">—</dd><dt>cycle</dt></div>
      <div><dd data-kpi="idle">—</dd><dt>idle</dt></div>
    </dl>
    <div class="bar-right">
      <span id="summary" class="status" role="status"></span>
      <button type="button" id="stop-all" class="bar-stop" aria-keyshortcuts="Shift+Escape">stop</button>
      <button type="button" id="palette-open" class="slash" aria-label="Open command palette" aria-keyshortcuts="/ Meta+K Control+K"><kbd>/</kbd></button>
    </div>
  </header>

  <footer class="chrome chrome-bottom">
    <ul id="trucks" class="fleet" aria-label="Fleet"></ul>
    <p id="caption-hint" class="caption-hint meta"></p>
  </footer>

  <div id="alert" class="alert" role="alert" hidden></div>
  <p id="notice" class="notice" role="status" hidden></p>

  <div id="toast" class="toast" role="status" hidden>
    <p class="toast-title"></p>
    <p class="toast-body"></p>
  </div>

  <div id="palette" class="palette-root" hidden>
    <div class="palette-scrim" data-close></div>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-input-row">
        <span class="palette-glyph" aria-hidden="true">/</span>
        <input id="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="command">
      </div>
      <div class="palette-body">
        <div id="palette-list" class="palette-list" role="listbox" aria-label="Commands"></div>
        <span class="palette-cursor" aria-hidden="true"></span>
      </div>
      <p class="palette-empty" hidden>no match</p>
    </div>
  </div>

  <div id="help" class="palette-root" hidden>
    <div class="palette-scrim" data-close></div>
    <div class="palette help" role="dialog" aria-modal="true" aria-labelledby="help-title" tabindex="-1">
      <div class="palette-input-row"><h2 id="help-title" class="help-title">keyboard</h2></div>
      <dl class="help-list"></dl>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
