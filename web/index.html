<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quarry Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Quarry Control</h1>
    <span id="sim-status" class="pill off">sim offline</span>
    <span id="summary" class="summary"></span>
  </header>
  <main>
    <section id="feeds" aria-label="Camera feeds"></section>
    <aside>
      <h2>Map</h2>
      <p class="hint">Select a truck, then click the map (snaps to the nearest site or junction when roads exist) or pick a site.</p>
      <canvas id="map" width="800" height="800"></canvas>
      <ul id="trucks"></ul>
      <h2>Lidar</h2>
      <canvas id="lidar"></canvas>
    </aside>
  </main>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
